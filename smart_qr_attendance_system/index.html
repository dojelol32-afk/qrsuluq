<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بوابة الطالب - نظام الحضور الذكي</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    [hidden] { display: none !important; }
    body { background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
    .card { background: #ffffff; padding: 30px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); width: 100%; max-width: 450px; text-align: center; }
    h2 { margin-top: 0; color: #333; font-size: 22px; }
    p.subtitle { color: #777; font-size: 13px; margin-bottom: 25px; }
    .input-group { margin-bottom: 15px; }
    .input-group input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; text-align: center; font-size: 16px; outline: none; }
    .input-group input:focus { border-color: #4f46e5; }
    #reader { width: 100%; min-height: 280px; border-radius: 12px; overflow: hidden; background: #111; margin: 15px 0; }
    .btn { width: 100%; background: #4f46e5; color: white; border: none; padding: 14px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 8px; }
    .btn:hover { background: #4338ca; }
    .btn:disabled { opacity: .6; cursor: not-allowed; }
    .btn.secondary { background: #e5e7eb; color: #333; }
    .btn.secondary:hover { background: #d1d5db; }
    .message { margin-top: 15px; font-weight: bold; font-size: 15px; min-height: 22px; }
    .message.success { color: #16a34a; }
    .message.error { color: #dc2626; }
    .who { color: #555; font-size: 14px; margin-bottom: 5px; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
</head>
<body>

<div class="card">
  <!-- Login -->
  <div id="loginView">
    <h2>تسجيل الحضور الطلابي</h2>
    <p class="subtitle">سجّل الدخول ثم امسح رمز QR المعروض على شاشة المحاضر</p>
    <div class="input-group">
      <input type="text" id="identifier" placeholder="رقم الطالب" autocomplete="username" inputmode="text">
    </div>
    <div class="input-group">
      <input type="password" id="password" placeholder="كلمة المرور" autocomplete="current-password">
    </div>
    <button class="btn" id="btnLogin">تسجيل الدخول</button>
    <div id="loginMsg" class="message"></div>
  </div>

  <!-- Scan -->
  <div id="scanView" hidden>
    <h2>امسح رمز الحضور</h2>
    <div class="who" id="whoAmI"></div>
    <p class="subtitle">وجّه الكاميرا نحو الرمز المعروض أمام المحاضر</p>
    <div id="reader"></div>
    <button class="btn secondary" id="btnRescan" hidden>مسح رمز جديد</button>
    <button class="btn secondary" id="btnLogout">تسجيل الخروج</button>
    <div id="scanMsg" class="message"></div>
  </div>
</div>

<script>
  const API_BASE_URL = 'https://qrsuluq.onrender.com';
  const $ = (id) => document.getElementById(id);

  let jwtToken = sessionStorage.getItem('jwt');
  let userName = sessionStorage.getItem('userName') || '';
  let scanner = null;
  let busy = false;

  function setMsg(el, text, type) {
    el.className = 'message' + (type ? ' ' + type : '');
    el.textContent = text;
  }

  function showView(name) {
    $('loginView').hidden = name !== 'login';
    $('scanView').hidden = name !== 'scan';
  }

  async function api(path, options = {}) {
    const headers = { 'Content-Type': 'application/json' };
    if (jwtToken) headers['Authorization'] = 'Bearer ' + jwtToken;
    const res = await fetch(API_BASE_URL + path, { ...options, headers });
    let data = {};
    try { data = await res.json(); } catch (e) { /* non-JSON response */ }
    return { ok: res.ok, status: res.status, data };
  }

  async function login() {
    const identifier = $('identifier').value.trim();
    const password = $('password').value;
    const msg = $('loginMsg');

    if (!identifier || !password) {
      setMsg(msg, 'أدخل رقم الطالب وكلمة المرور', 'error');
      return;
    }

    $('btnLogin').disabled = true;
    setMsg(msg, 'جاري تسجيل الدخول...');
    try {
      const { ok, data } = await api('/api/auth/login', {
        method: 'POST',
        body: JSON.stringify({ identifier, password })
      });
      if (!ok) { setMsg(msg, data.error || 'فشل تسجيل الدخول', 'error'); return; }
      if (data.user.role !== 'Student') {
        setMsg(msg, 'هذه البوابة للطلاب فقط. استخدم صفحة المحاضر.', 'error');
        return;
      }
      jwtToken = data.token;
      userName = data.user.full_name;
      sessionStorage.setItem('jwt', jwtToken);
      sessionStorage.setItem('userName', userName);
      $('password').value = '';
      setMsg(msg, '');
      openScanView();
    } catch (e) {
      setMsg(msg, 'فشل الاتصال بالسيرفر', 'error');
    } finally {
      $('btnLogin').disabled = false;
    }
  }

  function logout() {
    stopScanner();
    jwtToken = null;
    sessionStorage.removeItem('jwt');
    sessionStorage.removeItem('userName');
    showView('login');
  }

  function openScanView() {
    $('whoAmI').textContent = 'مرحباً ' + userName;
    showView('scan');
    startScanner();
  }

  async function startScanner() {
    busy = false;
    $('btnRescan').hidden = true;
    setMsg($('scanMsg'), '');
    if (!scanner) scanner = new Html5Qrcode('reader');
    try {
      await scanner.start(
        { facingMode: 'environment' },
        { fps: 10, qrbox: { width: 240, height: 240 } },
        onScanSuccess,
        () => {}
      );
    } catch (e) {
      setMsg($('scanMsg'), 'تعذر تشغيل الكاميرا. اسمح باستخدامها وتأكد أن الصفحة تعمل عبر HTTPS.', 'error');
      $('btnRescan').hidden = false;
    }
  }

  async function stopScanner() {
    try {
      if (scanner && scanner.isScanning) await scanner.stop();
    } catch (e) { /* already stopped */ }
  }

  async function onScanSuccess(text) {
    if (busy) return;
    busy = true;
    await stopScanner();

    let payload = null;
    try { payload = JSON.parse(text); } catch (e) { /* not our QR */ }

    const msg = $('scanMsg');
    if (!payload || !payload.s || !payload.t) {
      setMsg(msg, 'رمز QR غير صالح', 'error');
      $('btnRescan').hidden = false;
      return;
    }

    setMsg(msg, 'جاري تسجيل الحضور...');
    try {
      const { ok, status, data } = await api('/api/attendance/scan', {
        method: 'POST',
        body: JSON.stringify({ session_id: payload.s, token: payload.t })
      });

      if (status === 401) { logout(); setMsg($('loginMsg'), 'انتهت الجلسة، سجّل الدخول من جديد', 'error'); return; }

      if (ok) {
        setMsg(msg, data.message || 'تم تسجيل الحضور بنجاح!', 'success');
      } else {
        setMsg(msg, data.error || 'تعذر تسجيل الحضور', 'error');
        // Allow retry unless it's a duplicate
        if (status !== 409) $('btnRescan').hidden = false;
      }
    } catch (e) {
      setMsg(msg, 'فشل الاتصال بالسيرفر', 'error');
      $('btnRescan').hidden = false;
    }
  }

  $('btnLogin').addEventListener('click', login);
  $('password').addEventListener('keydown', (e) => { if (e.key === 'Enter') login(); });
  $('btnRescan').addEventListener('click', startScanner);
  $('btnLogout').addEventListener('click', logout);

  if (jwtToken) openScanView(); else showView('login');
</script>
</body>
</html>
